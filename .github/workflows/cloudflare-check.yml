name: Cloudflare migration checks
on:
  push:
    branches: [cloudflare-migration]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate Functions syntax
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Tests and Vite build
        run: npm run build
